# Alternative to run_local.py for people who prefer compose. Neo4j only binds to 127.0.0.1.
#   docker compose up -d neo4j
#   python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
#   NEO4J_URI=bolt://127.0.0.1:7687 NEO4J_PASSWORD=tinkerlab-test .venv/bin/python seed_cartography.py --wipe --fixtures
#   NEO4J_URI=bolt://127.0.0.1:7687 NEO4J_PASSWORD=tinkerlab-test .venv/bin/python server.py   # http://127.0.0.1:8744
# run_local.py does all of this (and the same container/volume names), so the two are interchangeable.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: gx-neo4j
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    environment:
      NEO4J_AUTH: neo4j/tinkerlab-test   # test-only password
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - gx-neo4j-data:/data
volumes:
  gx-neo4j-data:
    name: gx-neo4j-data
