# Alternative to run_local.py for people who prefer compose. Both ports bind to 127.0.0.1.
#   docker compose up -d neo4j graphql
#   python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
#   NEO4J_URI=bolt://127.0.0.1:7687 NEO4J_PASSWORD=tinkerlab-test .venv/bin/python seed_cartography.py --wipe --fixtures
#   NEO4J_URI=bolt://127.0.0.1:7687 NEO4J_PASSWORD=tinkerlab-test \
#   GRAPHQL_ENDPOINT=http://127.0.0.1:8791/graphql GRAPHQL_AUTH_URL=http://127.0.0.1:8791/oauth/token \
#   GRAPHQL_CLIENT_ID=gx-graphql GRAPHQL_CLIENT_SECRET=tinkerlab-graphql GRAPHQL_ADAPTER=wiz \
#   .venv/bin/python server.py   # http://127.0.0.1:8744
# run_local.py does all of this (and the same container names), so the two are interchangeable.
# gx-graphql is a small Wiz-shaped fixture. It has no volume.
# The 15M node / 60M edge graph is `python3 run_local.py --live-scale` (heap 4G, page cache 8G).
# This file keeps the small defaults.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: gx-neo4j
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    environment:
      NEO4J_AUTH: neo4j/tinkerlab-test   # test-only password
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - gx-neo4j-data:/data
  graphql:
    image: python:3.12-alpine
    container_name: gx-graphql
    ports:
      - "127.0.0.1:8791:8791"
    volumes:
      - ./tools/graphql_fixture.py:/fixture.py:ro
    command: ["python", "/fixture.py", "--host", "0.0.0.0", "--port", "8791"]
volumes:
  gx-neo4j-data:
    name: gx-neo4j-data
