<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graph Explorer (Neo4j)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <div id="cy"></div>
  <canvas id="overlay"></canvas>

  <div id="landing">
    <div class="landing-title">Get started with one of the options:</div>
    <button class="pill" data-act="focus-search"><i data-icon="Magnify" class="blue"></i>Search for nodes/edges</button>
    <button class="pill" data-act="explore-queries"><i data-icon="CodeBraces"></i>Explore queries</button>
    <button class="pill" data-act="code-query"><i data-icon="CodeBracesBox"></i>Code a query</button>
    <button class="pill" data-act="data-model"><i data-icon="DatabaseOutline" class="red"></i>Understand your data model</button>
    <button class="pill" data-act="help"><i data-icon="HelpCircleOutline"></i>Help</button>
  </div>

  <div class="card toolbar" id="topleft">
    <button data-act="main-menu" title="Menu"><i data-icon="Menu"></i></button>
    <button data-act="undo" id="btn-undo" title="Undo (Ctrl+Z)"><i data-icon="ArrowLeft"></i></button>
    <button data-act="redo" id="btn-redo" title="Redo (Ctrl+Y)"><i data-icon="ArrowRight"></i></button>
    <button data-act="code-query" title="Code a query"><i data-icon="CodeBracesBox"></i></button>
    <button data-act="more-menu" title="More"><i data-icon="DotsHorizontal"></i></button>
  </div>
  <button class="card" id="open-selpanel" data-act="open-selpanel" title="Open selection panel"><i data-icon="DockLeft"></i></button>

  <div id="search">
    <input id="search-input" placeholder="" autocomplete="off" spellcheck="false">
    <i data-icon="Magnify" class="search-icon"></i>
    <button id="search-clear" title="Clear"><i data-icon="Close"></i></button>
    <div id="search-dd" class="card hidden">
      <div class="sd-head">
        <span class="sd-kind"><a data-kind="node" class="on"><i data-icon="CircleMultipleOutline"></i>NODES</a> - <a data-kind="edge"><i data-icon="VectorPolyline"></i>EDGES</a></span>
        <span class="sd-scope"><a data-scope="all" class="on">ALL</a> - <a data-scope="local">LOCAL</a></span>
        <a class="sd-adv" data-act="advanced-search">Advanced</a>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <div class="card toolbar vertical" id="righttb">
    <button data-panel="filters" title="Filters"><i data-icon="FilterVariant"></i></button>
    <button data-panel="timeline" title="Timeline"><i data-icon="ClockOutline"></i></button>
    <div class="sep"></div>
    <button data-panel="design" title="Design"><i data-icon="Brush"></i></button>
    <button data-panel="layout" title="Layout"><i data-icon="GraphOutline"></i></button>
    <div class="sep"></div>
    <button data-panel="nodegroup" title="Node grouping"><i data-icon="SelectGroup"></i></button>
    <button data-panel="edgegroup" title="Edge grouping"><i data-icon="VectorLink"></i></button>
    <div class="sep"></div>
    <button data-panel="queries" title="Queries"><i data-icon="CodeBraces"></i></button>
  </div>
  <aside id="rightpanel" class="hidden"></aside>
  <aside id="leftpanel" class="hidden"></aside>

  <div id="statusbar"><span id="viz-title" class="chip hidden"></span><span id="save-chip" class="chip warn"><i data-icon="AlertCircleOutline"></i>Not saved</span><span id="budget-chip" class="chip" data-act="budget" title="Working set on screen"></span></div>
  <div id="watermark">GRAPH&nbsp;EXPLORER <small>for Neo4j</small></div>
  <div class="card toolbar" id="zoomctl">
    <button data-act="zoom-out" title="Zoom out (-)"><i data-icon="Minus"></i></button>
    <button data-act="zoom-in" title="Zoom in (+)"><i data-icon="Plus"></i></button>
    <button data-act="locate" title="Locate"><i data-icon="CrosshairsGps"></i></button>
    <button data-act="minimap" title="Minimap" id="btn-minimap"><i data-icon="MapOutline"></i></button>
  </div>
  <button id="help-btn" data-act="help"><i data-icon="HelpCircleOutline"></i>Help</button>
  <canvas id="minimap" class="card hidden" width="200" height="130"></canvas>
  <div id="menus"></div>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <div id="conn" class="chip"></div>
</div>
<script src="/vendor/cytoscape.min.js"></script>
<script src="/vendor/layout-base.js"></script>
<script src="/vendor/cose-base.js"></script>
<script src="/vendor/cytoscape-fcose.js"></script>
<script src="/vendor/graphology-fa2.js"></script>
<script src="/icons.js"></script>
<script src="/render.js"></script>
<script src="/app.js"></script>
</body>
</html>
